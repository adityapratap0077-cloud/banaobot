{% extends "dash_base.html" %}
{% block title %}New business · Basics{% endblock %}
{% block content %}
{% with step=1 %}{% include "dash_steps.html" %}{% endwith %}
<div class="pagehead"><div>
  <h1>Let's meet your {{ tpl.name|lower }}</h1>
  <p>Step 1 of 5 — the basics. <a href="{{ url_for('dashboard.onboarding') }}">← change type</a></p>
</div></div>
<div class="card">
  {% if error %}<div class="formerror">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="template" value="{{ tid }}">
    <label class="f">Business name *
      <input type="text" name="name" required placeholder="e.g. Sharma Dhaba" value="{{ request.form.get('name','') }}">
    </label>
    <label class="f">Default language
      <select name="language">
        <option value="en" {% if request.form.get('language','en')=='en' %}selected{% endif %}>English</option>
        <option value="hi" {% if request.form.get('language')=='hi' %}selected{% endif %}>हिन्दी (Hindi)</option>
      </select>
      <span class="hint">The bot greets customers in this language first.</span>
    </label>
    <label class="f">Owner phone *
      <input type="text" name="owner_phone" required inputmode="tel" placeholder="e.g. 919876543210"
             value="{{ request.form.get('owner_phone','') }}">
      <span class="hint">When a customer asks for a human, the bot alerts this number.</span>
    </label>
    <div class="row2">
      <label class="f">Tagline (English)
        <input type="text" name="tagline_en" placeholder="e.g. Ghar jaisa khana">
      </label>
      <label class="f">Tagline (Hindi)
        <input type="text" name="tagline_hi" placeholder="e.g. घर जैसा खाना">
      </label>
    </div>
    <button class="btn block" type="submit">Continue to {{ tpl.catalog.en|lower }} →</button>
  </form>
</div>
{% endblock %}
