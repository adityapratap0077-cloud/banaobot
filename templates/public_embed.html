<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bot.name }} — BanaoBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #faf6ee; }
    .embed-shell { height: 100vh; height: 100dvh; display: flex; }
    .embed-shell .chat-shell { flex: 1; display: flex; flex-direction: column; border: none; box-shadow: none; border-radius: 0; }
    .embed-shell .chat-log { flex: 1; max-height: none; }
    .embed-shell .chat-head { border-bottom: 2px solid #16130e; }
  </style>
</head>
<body>
  <div class="embed-shell">
    <div class="chat-shell">
      <div class="chat-head">
        <div class="chat-avatar" aria-hidden="true">{{ bot.name[0] }}</div>
        <div>
          <div class="chat-title">{{ bot.name }}</div>
          <div class="chat-sub">Powered by BanaoBot</div>
        </div>
        <span class="chat-status">Online</span>
      </div>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input type="text" id="chat-input" placeholder="Write a message&hellip;" aria-label="Message" maxlength="2000">
        <button type="submit" class="btn btn-accent">Send</button>
      </form>
    </div>
  </div>
<script>
(function () {
  var log = document.getElementById('chat-log');
  var form = document.getElementById('chat-form');
  var input = document.getElementById('chat-input');
  var botName = {{ bot.name|tojson }};
  var chatUrl = {{ url_for('public_chat_message', token=bot.share_token)|tojson }};

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMsg(text, who) {
    var div = document.createElement('div');
    div.className = 'msg msg-' + who;
    var meta = document.createElement('span');
    meta.className = 'msg-meta';
    meta.textContent = who === 'user' ? 'You' : botName;
    div.appendChild(meta);
    var parts = String(text).split('\n');
    parts.forEach(function (part, i) {
      if (i > 0) div.appendChild(document.createElement('br'));
      div.appendChild(document.createTextNode(part));
    });
    log.appendChild(div);
    scrollDown();
  }

  function addTyping() {
    var div = document.createElement('div');
    div.className = 'typing';
    div.setAttribute('aria-label', botName + ' is typing');
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    scrollDown();
    return div;
  }

  addMsg('Hi! Ask me anything — I\u2019m here to help.', 'bot');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    input.focus();
    var typing = addTyping();
    fetch(chatUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('bad status');
        return res.json();
      })
      .then(function (data) {
        typing.remove();
        addMsg(data.reply || '(no reply)', 'bot');
      })
      .catch(function () {
        typing.remove();
        addMsg('Something went wrong. Please try again in a moment.', 'bot msg-error');
      });
  });
})();
</script>
</body>
</html>
