{% extends "dash_base.html" %}
{% block title %}{{ biz.name }} · Welcome{% endblock %}
{% block content %}
{% with step=5 %}{% include "dash_steps.html" %}{% endwith %}
<div class="pagehead"><div><h1>Welcome message 🎉</h1><p>Step 5 of 6 — the first thing customers see. Then you're live!</p></div></div>
<div class="card">
  <form method="post">
    <label class="f">Welcome (English)
      <textarea name="welcome_en" rows="5">{{ default_en }}</textarea>
      <span class="hint">Tip: *stars* make <b>bold</b> on WhatsApp.</span>
    </label>
    <label class="f">Welcome (Hindi)
      <textarea name="welcome_hi" rows="5">{{ default_hi }}</textarea>
    </label>
    <button class="btn block" type="submit">🚀 Finish — activate my bot</button>
  </form>
</div>
{% endblock %}
