<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BanaoBot{% endblock %} · BanaoBot</title>
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --brand:#0d9d78; --brand-dark:#0a7a5e; --header:#101c2e;
    --line:#e2e8f0; --danger:#dc2626; --amber:#d97706;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
       background:var(--bg); color:var(--ink); min-height:100vh;}
  /* ---------- header ---------- */
  .top{background:var(--header); color:#fff; padding:12px 16px;
       display:flex; align-items:center; justify-content:space-between;
       position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,.25);}
  .brand{color:#fff; text-decoration:none; font-weight:800; font-size:19px; letter-spacing:.2px;}
  .brand .dot{color:var(--brand);}
  .top nav{display:flex; align-items:center; gap:12px; font-size:14px;}
  .top nav a{color:#cbd5e1; text-decoration:none; font-weight:600;}
  .top nav a:hover{color:#fff;}
  .uemail{color:#94a3b8; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* ---------- layout ---------- */
  .wrap{max-width:960px; margin:0 auto; padding:20px 16px 72px;}
  .pagehead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:4px 0 16px;}
  .pagehead h1{font-size:22px; margin:0;}
  .pagehead p{color:var(--muted); margin:4px 0 0; font-size:14px;}
  .card{background:var(--card); border-radius:var(--radius); padding:18px;
        box-shadow:0 1px 3px rgba(15,23,42,.08); margin-bottom:16px; border:1px solid var(--line);}
  .card h2{margin:0 0 12px; font-size:17px;}
  .muted{color:var(--muted);}
  /* ---------- buttons / inputs ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
       background:var(--brand); color:#fff; border:none; border-radius:10px;
       padding:13px 20px; font-size:15px; font-weight:700; cursor:pointer;
       text-decoration:none; min-height:48px;}
  .btn:hover{background:var(--brand-dark);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--brand); color:var(--brand-dark);}
  .btn.danger{background:#fff; color:var(--danger); border:1.5px solid #fecaca;}
  .btn.small{min-height:38px; padding:8px 14px; font-size:13.5px;}
  .btn.block{width:100%;}
  .iconbtn{background:#f1f5f9; border:1px solid var(--line); border-radius:8px;
           min-width:40px; min-height:40px; font-size:16px; cursor:pointer; color:var(--ink);}
  .iconbtn:hover{background:#e2e8f0;}
  .iconbtn.danger{color:var(--danger);}
  label.f{display:block; margin:0 0 14px; font-size:14px; font-weight:600;}
  label.f .hint{display:block; font-weight:400; color:var(--muted); font-size:12.5px; margin-top:3px;}
  input[type=text],input[type=email],input[type=password],input[type=number],
  input[type=time],select,textarea{
    width:100%; margin-top:6px; padding:12px 14px; font-size:15px;
    border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    font-family:inherit;}
  textarea{min-height:96px; resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(13,157,120,.15);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:560px){ .row2{grid-template-columns:1fr;} }
  /* ---------- status badges ---------- */
  .badge{display:inline-block; padding:4px 12px; border-radius:999px; font-size:12.5px; font-weight:700;}
  .st-draft{background:#e2e8f0; color:#475569;}
  .st-active{background:#dcfce7; color:#166534;}
  .st-connected{background:#dbeafe; color:#1d4ed8;}
  /* ---------- flash + errors ---------- */
  .flash{border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:14.5px;}
  .flash.ok{background:#dcfce7; color:#14532d; border:1px solid #86efac;}
  .flash.error{background:#fee2e2; color:#7f1d1d; border:1px solid #fca5a5;}
  .formerror{background:#fee2e2; color:#7f1d1d; border:1px solid #fca5a5;
             border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:14.5px;}
  /* ---------- dashboard cards ---------- */
  .bizgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .bizcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
           padding:18px; text-decoration:none; color:inherit; display:block;
           box-shadow:0 1px 3px rgba(15,23,42,.08); transition:transform .12s;}
  .bizcard:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(15,23,42,.12);}
  .bizcard h3{margin:8px 0 10px; font-size:18px;}
  .stats{display:flex; gap:14px; margin-top:10px;}
  .stat b{font-size:19px; display:block;}
  .stat span{font-size:12px; color:var(--muted);}
  .newcard{border:2px dashed #cbd5e1; background:transparent; box-shadow:none;
           display:flex; align-items:center; justify-content:center; min-height:150px;
           color:var(--muted); font-weight:700; font-size:16px;}
  .newcard:hover{border-color:var(--brand); color:var(--brand-dark);}
  /* ---------- onboarding steps ---------- */
  .steps{display:flex; gap:6px; margin:0 0 20px; overflow-x:auto; padding-bottom:4px;}
  .steps span{flex:1; min-width:86px; text-align:center; font-size:12.5px; font-weight:700;
              padding:9px 6px; border-radius:10px; background:#fff; color:var(--muted);
              border:1px solid var(--line); white-space:nowrap;}
  .steps span.done{background:#dcfce7; color:#166534; border-color:#86efac;}
  .steps span.cur{background:var(--header); color:#fff; border-color:var(--header);}
  /* ---------- business home ---------- */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
        padding:16px; text-align:center;}
  .tile b{font-size:28px; display:block;}
  .tile span{font-size:12.5px; color:var(--muted);}
  .navgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .navgrid a{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:16px 10px;
             text-align:center; text-decoration:none; color:var(--ink); font-weight:700; font-size:14px;}
  .navgrid a:hover{border-color:var(--brand); color:var(--brand-dark);}
  .navgrid a .e{font-size:24px; display:block; margin-bottom:6px;}
  table.tbl{width:100%; border-collapse:collapse; font-size:14px;}
  table.tbl th{text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase;
               letter-spacing:.4px; padding:8px 6px; border-bottom:1px solid var(--line);}
  table.tbl td{padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  .tablewrap{overflow-x:auto;}
  .alert{border-left:4px solid var(--amber); background:#fffbeb; border-radius:8px;
         padding:12px 14px; margin-bottom:10px; font-size:14px;}
  .alert .when{color:var(--muted); font-size:12px;}
  .empty{color:var(--muted); text-align:center; padding:24px 12px; font-size:14.5px;}
  /* ---------- checklist ---------- */
  ol.check{list-style:none; counter-reset:c; padding:0; margin:0;}
  ol.check>li{counter-increment:c; background:#fff; border:1px solid var(--line);
              border-radius:var(--radius); padding:18px 18px 18px 64px; margin-bottom:14px; position:relative;}
  ol.check>li::before{content:counter(c); position:absolute; left:18px; top:18px;
              width:32px; height:32px; border-radius:50%; background:var(--header); color:#fff;
              display:flex; align-items:center; justify-content:center; font-weight:800;}
  ol.check h3{margin:0 0 8px; font-size:16px;}
  ol.check p, ol.check li li{font-size:14px; color:#334155; line-height:1.55;}
  code.pill{background:#0f172a; color:#a5f3d0; padding:3px 9px; border-radius:7px;
            font-size:13px; word-break:break-all;}
  /* ---------- auth ---------- */
  .authbox{max-width:420px; margin:32px auto;}
  .authbox .logo{text-align:center; font-size:30px; font-weight:800; margin-bottom:6px;}
  .authbox .sub{text-align:center; color:var(--muted); margin-bottom:20px; font-size:14.5px;}
  .alt{text-align:center; margin-top:14px; font-size:14px; color:var(--muted);}
  .alt a{color:var(--brand-dark); font-weight:700;}
  .backlink{display:inline-block; margin-bottom:14px; color:var(--muted); text-decoration:none; font-size:14px;}
  .backlink:hover{color:var(--ink);}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('dashboard.index') }}">🤖 Banao<span class="dot">Bot</span></a>
  <nav>
    {% if session.get('user_id') %}
      <span class="uemail">{{ session.get('email', '') }}</span>
      <a href="{{ url_for('dashboard.logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('dashboard.login') }}">Login</a>
    {% endif %}
  </nav>
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="flash {{ 'error' if cat == 'error' else 'ok' }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
