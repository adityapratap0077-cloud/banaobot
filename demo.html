<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bhoj House — WhatsApp demo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b141a; display: flex; justify-content: center; min-height: 100vh;
  }
  .phone {
    width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column;
    background: #0b141a;
  }
  @media (min-width: 520px) {
    body { padding: 24px; }
    .phone { height: calc(100vh - 48px); border-radius: 28px; overflow: hidden;
             box-shadow: 0 12px 60px rgba(0,0,0,.5); border: 1px solid #222; }
  }
  .header {
    background: #1f2c34; color: #e9edef; padding: 10px 14px; display: flex;
    align-items: center; gap: 12px; flex-shrink: 0;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: #d4a017;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .who .name { font-weight: 600; font-size: 16px; }
  .who .status { font-size: 12px; color: #8696a0; }
  .who .demo { font-size: 11px; color: #d4a017; }
  .chat {
    flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px;
    background-color: #0b141a;
    background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 14.5px;
         line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.in { background: #1f2c34; color: #e9edef; align-self: flex-start;
            border-top-left-radius: 2px; }
  .msg.out { background: #005c4b; color: #e9edef; align-self: flex-end;
             border-top-right-radius: 2px; }
  .msg .time { display: block; text-align: right; font-size: 10px; color: #8696a0; margin-top: 4px; }
  .opts { display: flex; flex-direction: column; gap: 6px; max-width: 85%; align-self: flex-start; width: 85%; }
  .opt {
    background: #1f2c34; color: #53bdeb; border: none; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; text-align: center; cursor: pointer;
  }
  .opt:active { background: #2a3942; }
  .opt.list-toggle { color: #e9edef; }
  .rows { display: none; flex-direction: column; gap: 6px; }
  .rows.open { display: flex; }
  .row {
    background: #1f2c34; color: #e9edef; border: none; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; text-align: left; cursor: pointer;
  }
  .row small { display: block; color: #8696a0; font-size: 12px; margin-top: 2px; }
  .row:active { background: #2a3942; }
  .typing { color: #8696a0; font-size: 13px; align-self: flex-start; padding: 4px 8px; }
  .bar {
    background: #1f2c34; padding: 8px 10px; display: flex; gap: 8px; flex-shrink: 0;
  }
  .bar input {
    flex: 1; border: none; border-radius: 22px; padding: 10px 16px; font-size: 15px;
    background: #2a3942; color: #e9edef; outline: none;
  }
  .bar button {
    border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
    background: #00a884; color: #fff; font-size: 18px; flex-shrink: 0;
  }
  .hint { text-align: center; color: #8696a0; font-size: 12px; padding: 6px 16px; }
</style>
</head>
<body>
<div style="max-width:420px;margin:0 auto 10px;text-align:center;font-family:system-ui,sans-serif;">
  <a href="/app/" style="display:inline-block;background:#0d9d78;color:#fff;text-decoration:none;
     padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;">
     🤖 Build your own bot — open the BanaoBot dashboard →</a>
</div>
<div class="phone">
  <div class="header">
    <div class="avatar">🍽️</div>
    <div class="who">
      <div class="name">Bhoj House</div>
      <div class="status">online</div>
      <div class="demo">DEMO — not connected to WhatsApp</div>
    </div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="hint">Try: <b>hi</b> · <b>menu</b> · <b>book a table</b> · <b>नमस्ते</b> · <b>डिलीवरी?</b></div>
  <div class="bar">
    <input id="input" placeholder="Message" autocomplete="off">
    <button id="send" aria-label="Send">➤</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const PHONE = 'demo-' + Math.floor(Math.random() * 1e9);

function now() {
  const d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmt(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*([^*]+)\*/g, '<b>$1</b>')
    .replace(/_([^_]+)_/g, '<i>$1</i>');
}
function bubble(text, side) {
  const div = document.createElement('div');
  div.className = 'msg ' + side;
  div.innerHTML = fmt(text) + '<span class="time">' + now() + '</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function send(text) {
  text = (text || '').trim();
  if (!text) return;
  bubble(text, 'out');
  input.value = '';
  // remove old option buttons
  document.querySelectorAll('.opts').forEach(e => e.remove());
  const tp = document.createElement('div');
  tp.className = 'typing'; tp.textContent = 'typing…';
  chat.appendChild(tp); chat.scrollTop = chat.scrollHeight;
  fetch('/demo/message', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({phone: PHONE, text})
  })
  .then(r => r.json())
  .then(d => {
    tp.remove();
    setTimeout(() => renderReplies(d.replies || []), 350);
  })
  .catch(() => { tp.remove(); bubble('⚠️ demo server not reachable', 'in'); });
}
function renderReplies(replies) {
  replies.forEach(r => {
    if (r.type === 'text') {
      bubble(r.text.body, 'in');
    } else if (r.type === 'interactive') {
      const iv = r.interactive;
      bubble(iv.body.text, 'in');
      if (iv.footer) bubble('_' + iv.footer.text + '_', 'in');
      const box = document.createElement('div');
      box.className = 'opts';
      if (iv.type === 'button') {
        iv.action.buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = 'opt';
          btn.textContent = b.reply.title;
          btn.onclick = () => send(b.reply.id);
          box.appendChild(btn);
        });
      } else if (iv.type === 'list') {
        const tog = document.createElement('button');
        tog.className = 'opt list-toggle';
        tog.textContent = '▾ ' + iv.action.button;
        const rows = document.createElement('div');
        rows.className = 'rows';
        tog.onclick = () => rows.classList.toggle('open');
        iv.action.sections.forEach(s => {
          s.rows.forEach(rw => {
            const rb = document.createElement('button');
            rb.className = 'row';
            rb.innerHTML = fmt(rw.title) +
              (rw.description ? '<small>' + fmt(rw.description) + '</small>' : '');
            rb.onclick = () => send(rw.id);
            rows.appendChild(rb);
          });
        });
        box.appendChild(tog); box.appendChild(rows);
      }
      chat.appendChild(box);
      chat.scrollTop = chat.scrollHeight;
    }
  });
}
document.getElementById('send').onclick = () => send(input.value);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(input.value); });
// kick off the conversation
send('hi');
</script>
</body>
</html>
